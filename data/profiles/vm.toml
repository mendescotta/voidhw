# Guest tools for virtual machines. Services are runit names; voidhw enables the matching
# dinit service on dinit systems.

[[profile]]
id = "vm-vmware"
desc = "VMware guest tools (clipboard, shared folders, display resize)"
priority = 10
packages = ["open-vm-tools"]
services = ["vmtoolsd", "vmware-vmblock-fuse"]
notes = ["Enable 3D acceleration in the VM settings for the best graphics (vmwgfx). On VMware the vmwgfx driver is supported and logs no warning."]
[profile.match]
vm = ["vmware"]

[[profile]]
id = "vm-virtualbox"
desc = "VirtualBox Guest Additions"
priority = 10
# the matching 7.x kernel modules need headers + dkms; without them the in-tree 6.0.0 driver loads and mismatches
packages = ["linux-headers", "virtualbox-ose-guest-dkms", "virtualbox-ose-guest"]
services = ["vboxservice"]
notes = ["The VMSVGA controller uses the vmwgfx driver, which logs 'unsupported hypervisor' on VirtualBox. It is harmless; the VBoxSVGA controller avoids the message (without 3D)."]
[profile.match]
vm = ["virtualbox"]

[[profile]]
id = "vm-qemu"
desc = "QEMU/KVM guest agent and SPICE integration"
priority = 10
packages = ["qemu-ga", "spice-vdagent"]
services = ["spice-vdagentd"]
[profile.match]
vm = ["qemu"]

[[profile]]
id = "vm-hyperv"
desc = "Hyper-V guest (drivers are in the kernel)"
priority = 10
notes = ["Hyper-V integration services are built into the Void kernel; nothing to install."]
[profile.match]
vm = ["hyperv"]
