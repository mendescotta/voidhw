# NVIDIA proprietary drivers, one profile per Void branch. The branch for a GPU comes from
# data/nvidia-branches.toml (NVIDIA's supported-chips lists). All of them live in the nonfree repo.

[[profile]]
id = "nvidia-current"
desc = "NVIDIA proprietary driver, current branch (Turing and newer)"
priority = 20
packages = ["nvidia"]
repos = ["nonfree"]
[[profile.files]]
path = "/etc/modprobe.d/voidhw-nvidia-drm.conf"
content = "options nvidia_drm modeset=1 fbdev=1\n"
[profile.match]
class = ["0300", "0302", "0380"]
vendor = ["10de"]
nvidia_branch = "current"

